<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Interview Prep</title>
    <meta name="description" content="Practice a real interview for the job you're applying to." />
    <meta name="author" content="YOUR ORGANIZATION" />
    <meta name="theme-color" content="#1b4b8f" />

    <!--
      BRANDING - EDIT BEFORE LAUNCH.

      1. Put your own icons in public/ :
             favicon.ico        multi-size ICO, 32px + 180px PNG payloads
             icon-32.png        browser tab
             icon-192.png       Android / PWA / link previews
             icon-180.png       Apple touch icon
         A bare /favicon.ico request and a bookmark both bypass the <link>
         tags below, so ship a real .ico as well as the PNGs.
      2. Uncomment the four <link> tags.
      3. Uncomment the og:image / twitter:image tags.
      4. Set theme-color above to your brand colour.
      5. Replace "YOUR ORGANIZATION" in the author tag.

      Shipped with no icons on purpose: an unbranded tab is better than
      shipping someone else's logo.
    -->
    <!--
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    -->

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Interview Prep" />
    <meta property="og:description" content="Practice a real interview for the job you're applying to." />
    <!-- <meta property="og:image" content="/icon-192.png" /> -->

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Interview Prep" />
    <meta name="twitter:description" content="Practice a real interview for the job you're applying to." />
    <!-- <meta name="twitter:image" content="/icon-192.png" /> -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
